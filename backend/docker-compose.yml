version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: stock_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: stockdb
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stock-net  # <-- Agregamos la DB a la red también

  redis:
    image: redis:alpine
    container_name: stock-redis
    ports:
      - "6379:6379"
    networks:
      - stock-net  

volumes:
  db_data:

networks:
  stock-net:
    driver: bridge